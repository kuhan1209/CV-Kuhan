<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuhan Vimalan - Mine Interesser</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(160deg, #0a0f1a 0%, #1a1f3a 40%, #0d2137 100%);
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .container {
            max-width: 860px;
            width: 100%;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 3.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, #a0c4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { font-size: 1.1rem; font-weight: 300; opacity: 0.7; margin-bottom: 1rem; }
        .intro { font-size: 0.95rem; opacity: 0.6; max-width: 500px; margin: 0 auto; line-height: 1.6; }
        .interests-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem;
        }
        .interest-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 1.8rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: default;
        }
        .interest-card:hover {
            transform: translateY(-4px);
            background: rgba(255,255,255,0.1);
            border-color: rgba(160,196,255,0.2);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .interest-card.centered {
            grid-column: 1 / -1;
            max-width: 50%;
            justify-self: center;
        }
        .icon { font-size: 2.2rem; margin-bottom: 0.8rem; }
        .interest-card h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
        .interest-card p { font-size: 0.88rem; opacity: 0.65; line-height: 1.5; }
        .footer {
            text-align: center; margin-top: 3rem; padding-top: 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.06);
            opacity: 0.4; font-size: 0.8rem; font-weight: 300;
        }
        .fade-in { animation: fadeIn 0.6s ease forwards; opacity: 0; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 600px) {
            .interests-grid { grid-template-columns: 1fr; }
            .interest-card.centered { max-width: 100%; }
            .container { padding: 2rem; }
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const interests = [
            {
                icon: "💻",
                title: "Programmering",
                description: "Brenner for å bygge webapplikasjoner med C#, .NET, Blazor og React. Trives best når kode blir til noe som gjør hverdagen enklere for folk."
            },
            {
                icon: "🏋️",
                title: "Trening",
                description: "Jeg holder meg aktiv med styrketrening og prøver å være konsekvent med treningsrutinene mine."
            },
            {
                icon: "📚",
                title: "Læring",
                description: "Alltid nysgjerrig – leser om teknologi, AI, UX-design og nye rammeverk."
            },
            {
                icon: "🌍",
                title: "Reise",
                description: "Jeg elsker å oppleve nye kulturer og steder sammen med min forlovede."
            }
        ];

        const centeredInterest = {
            icon: "🎮",
            title: "Gaming",
            description: "Liker å spille strategispill og utforske nye titler."
        };

        function InterestCard({ icon, title, description, centered, delay }) {
            const [visible, setVisible] = useState(false);

            useEffect(() => {
                const timer = setTimeout(() => setVisible(true), delay);
                return () => clearTimeout(timer);
            }, [delay]);

            return (
                <div
                    className={`interest-card ${centered ? "centered" : ""} ${visible ? "fade-in" : ""}`}
                    style={{ animationDelay: `${delay}ms`, opacity: visible ? undefined : 0 }}
                >
                    <div className="icon">{icon}</div>
                    <h3>{title}</h3>
                    <p>{description}</p>
                </div>
            );
        }

        function App() {
            const [headerVisible, setHeaderVisible] = useState(false);

            useEffect(() => {
                setHeaderVisible(true);
            }, []);

            return (
                <div className="container">
                    <div className={`header ${headerVisible ? "fade-in" : ""}`}>
                        <h1>Kuhan Vimalan</h1>
                        <p className="subtitle">Systemutvikler — Mine Interesser</p>
                        <p className="intro">
                            En nysgjerrig og engasjert utvikler som trives med å lære, bygge og utforske
                            – både digitalt og i den virkelige verden.
                        </p>
                    </div>

                    <div className="interests-grid">
                        {interests.map((item, index) => (
                            <InterestCard
                                key={item.title}
                                {...item}
                                delay={200 + index * 150}
                            />
                        ))}
                        <InterestCard
                            {...centeredInterest}
                            centered={true}
                            delay={200 + interests.length * 150}
                        />
                    </div>

                    <div className="footer">
                        <p>Scannet fra CV-en min • Kuhan Vimalan • kuhan2001@hotmail.com</p>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
